name: Feature request
description: Suggest an improvement to the Nimbus MCP connectors
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case — the service, the connector, and what you are trying to do with it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The tool or connector you would like added or changed. (Remember the constraints — a tool that changes anything must go through the consent kit, and a new runtime dependency must be pure JavaScript.)
    validations:
      required: false
