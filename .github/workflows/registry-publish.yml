name: Registry publish

# Signs the Readwise extension and adds it to the official Nimbus extension registry: the static
# folder on this repo's `gh-pages` branch, served by GitHub Pages. Called by release.yml after each
# connectors release; dispatch it by hand for the first publish. It publishes only when the version
# in connectors/readwise/nimbus.extension.json is not yet in the registry — every other run is a
# no-op, decided in `preflight` without the keys, so it never asks for an approval. The procedure
# and the owner's one-time setup are in docs/publishing.md.
#
# The protections here are pinned by scripts/publish-registry.test.ts, which parses this file.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Runs WITHOUT the environment and without any secret, so a refusal or a no-op here happens
  # before any approval prompt — and before GitHub would auto-create an `official-registry`
  # environment, unprotected, that does not exist yet.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Read the repository and its gh-pages branch. Nothing else.
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The owner sets OFFICIAL_REGISTRY_ENABLED=true last, once the environment (with required
      # reviewers, deployment restricted to main), its secrets, gh-pages and Pages are all in place.
      # release.yml skips this workflow until then; a manual dispatch is refused here.
      - name: Refuse unless the registry is enabled
        env:
          ENABLED: ${{ vars.OFFICIAL_REGISTRY_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::error::repository variable OFFICIAL_REGISTRY_ENABLED is not 'true'. Finish the one-time registry setup in docs/publishing.md (§ Publishing to the official Nimbus registry) and set the variable last."
            exit 1
          fi

      # Only main's code may hold the keys. The environment's deployment-branch rule is the
      # boundary; this is defence in depth, and it refuses before an approval is requested.
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::registry publishing runs from refs/heads/main only, not $REF"
            exit 1
          fi

      - name: Check the registry branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" --silent; then
            echo "::error::branch gh-pages does not exist. Bootstrapping the registry is the owner's one-time job — see docs/publishing.md § Publishing to the official Nimbus registry."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the registry (gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: registry
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      # Keyless: compares the Readwise manifest version with index.json. A missing index.json
      # fails here with the bootstrap instruction. Needs no install — --check imports only builtins.
      - name: Is there anything to publish?
        id: check
        run: bun scripts/publish-registry.ts --check

  # Boundary: holds the PUBLISHER key only, and signs and packs the one .tgz. No extension code
  # runs here after the key is on disk, and the registry root key never reaches this job.
  package:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: official-registry
    permissions:
      # Read the repository and its gh-pages branch. Nothing else.
      contents: read
    outputs:
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}
      id: ${{ steps.pack.outputs.id }}
      version: ${{ steps.pack.outputs.version }}
      packed: ${{ steps.pack.outputs.packed }}
    env:
      # The CLI is not on npm. Pinned to a release and to the SHA-256 of its linux binary, checked
      # here as a literal: SHA256SUMS comes from the same release as the binary, so it cannot be
      # the only check.
      NIMBUS_CLI_VERSION: v10.15.0
      NIMBUS_CLI_SHA256: "27c57c381e71c3dd968f9d5775de260e9495606bb91b02956857024d320e4a04"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No persisted credential: the build and the CLI run before any push, and neither needs one.
      - name: Checkout the registry (gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: registry
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      # No lifecycle scripts: nothing from a dependency may start a process that outlives this step
      # and is still running when the key is on disk. The Readwise build needs none.
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download and verify the Nimbus CLI
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nimbus-cli"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
            -o "$dir/nimbus" \
            "https://github.com/nimbus-agent/Nimbus/releases/download/${NIMBUS_CLI_VERSION}/nimbus-cli-linux-x64"
          printf '%s  %s\n' "$NIMBUS_CLI_SHA256" "$dir/nimbus" | sha256sum --check --strict -
          chmod +x "$dir/nimbus"

      # Built before the key exists; the signing step copies this file and builds nothing.
      - name: Build the extension bundle
        run: bun connectors/readwise/scripts/build-extension.ts

      # The key reaches the disk through env and the `printf` builtin — never argv, never a traced
      # shell — into a 0700 directory with umask 077, immediately before the one step that reads
      # it, at the fixed place the script looks for it. The CLI gets only its path.
      - name: Write the publisher key
        env:
          PUBLISHER_KEY: ${{ secrets.NIMBUS_PUBLISHER_KEY }}
          PUBLISHER_ID: ${{ vars.NIMBUS_PUBLISHER_ID }}
        run: |
          set -eu
          umask 077
          missing=""
          [ -n "${PUBLISHER_KEY:-}" ] || missing="$missing secret:NIMBUS_PUBLISHER_KEY"
          [ -n "${PUBLISHER_ID:-}" ] || missing="$missing variable:NIMBUS_PUBLISHER_ID"
          if [ -n "$missing" ]; then
            echo "::error::the official-registry environment is missing:$missing"
            exit 1
          fi
          keys="$RUNNER_TEMP/nimbus-keys"
          mkdir -m 700 "$keys"
          printf '%s' "$PUBLISHER_KEY" > "$keys/publisher.key"

      # Re-decides against the registry checkout: a version published since preflight packs nothing
      # (packed=false) and the later jobs are skipped.
      - name: Sign and pack the extension
        id: pack
        env:
          PUBLISHER_ID: ${{ vars.NIMBUS_PUBLISHER_ID }}
        # No path on argv: the script finds the registry, the bundle, the CLI and the key at the
        # fixed places the steps above put them (scripts/publish-registry.ts LAYOUT).
        run: bun scripts/publish-registry.ts --pack --publisher-id "$PUBLISHER_ID"

      # Remove the key before anything talks to the network again.
      - name: Delete the signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/nimbus-keys"

      - name: Upload the package
        if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readwise-package
          path: ${{ runner.temp }}/nimbus-package/package.tgz
          if-no-files-found: error

  # Boundary: runs the extension's code (its baseline and eval suites) in the platform sandbox, with
  # no environment, no secret, no checkout and a read-only token. It sees only the one .tgz.
  score:
    needs: package
    if: needs.package.outputs.packed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The gateway of the same release, checked as a literal and against its own line of
      # SHA256SUMS (both come from the release, so neither alone is a pin).
      NIMBUS_GATEWAY_VERSION: v10.15.0
      NIMBUS_GATEWAY_SHA256: "d6db7b01fdcc82c4389b25d79740c50ec6a7df96df4e8e309551eef0aca2d749"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readwise-package
          path: ${{ runner.temp }}/readwise-package

      - name: Set up the sandbox
        # System changes need root. The probe must NOT run as root: root bypasses the userns
        # restriction, so a probe under sudo would pass even if the sysctl writes did not apply.
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 update -qq < /dev/null
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 install -y -qq bubblewrap < /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          lib64=()
          if [ -d /lib64 ]; then lib64=(--ro-bind /lib64 /lib64); fi
          bwrap --unshare-user --unshare-net --new-session --ro-bind /usr /usr --ro-bind /etc /etc --ro-bind /lib /lib "${lib64[@]}" --proc /proc --dev /dev --tmpfs /tmp /usr/bin/true

      - name: Download the Nimbus gateway
        run: |
          set -euo pipefail
          base="https://github.com/nimbus-agent/Nimbus/releases/download/${NIMBUS_GATEWAY_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o nimbus-gateway-linux-x64 "$base/nimbus-gateway-linux-x64"
          printf '%s  %s\n' "$NIMBUS_GATEWAY_SHA256" nimbus-gateway-linux-x64 | sha256sum --check --strict -
          # Also this asset's own line of SHA256SUMS; checking the whole file fails on every
          # release asset this job did not download.
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep -E '^[0-9a-f]{64}  nimbus-gateway-linux-x64$' SHA256SUMS > CHECKSUM.txt
          test "$(wc -l < CHECKSUM.txt)" -eq 1
          sha256sum -c CHECKSUM.txt
          chmod +x nimbus-gateway-linux-x64

      # `scores` is left unset, so the action writes scores.json in the workspace.
      - name: Score the package
        uses: nimbus-agent/Nimbus/packages/github-actions/registry-action@d25dcdb9406fc89b755464b5430425419774f2d9 # v10.15.0
        with:
          mode: score-package
          package: ${{ runner.temp }}/readwise-package/package.tgz
          nimbus-gateway: ${{ github.workspace }}/nimbus-gateway-linux-x64

      - name: Upload the scores
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-scores
          path: scores.json
          if-no-files-found: error

  # Boundary: holds the registry ROOT key only. It checks the one .tgz against the digest package
  # computed, adds it with the (untrusted) scores, and pushes. It builds and installs nothing, so
  # no repository or dependency code runs where the root key is. A failed or skipped score job
  # skips this one: it needs score, with no always().
  publish:
    needs: [package, score]
    if: needs.package.outputs.packed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The protected environment holds the signing keys and requires a reviewer's approval. Its
    # secrets reach only the keyed jobs, and only after that approval.
    environment: official-registry
    permissions:
      # Push to gh-pages. Nothing else.
      contents: write
    concurrency:
      group: official-registry
      cancel-in-progress: false
    env:
      NIMBUS_CLI_VERSION: v10.15.0
      NIMBUS_CLI_SHA256: "27c57c381e71c3dd968f9d5775de260e9495606bb91b02956857024d320e4a04"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No persisted credential: the CLI runs before the push, and does not need one. The push step
      # supplies the token itself.
      - name: Checkout the registry (gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: registry
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Download and verify the Nimbus CLI
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nimbus-cli"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
            -o "$dir/nimbus" \
            "https://github.com/nimbus-agent/Nimbus/releases/download/${NIMBUS_CLI_VERSION}/nimbus-cli-linux-x64"
          printf '%s  %s\n' "$NIMBUS_CLI_SHA256" "$dir/nimbus" | sha256sum --check --strict -
          chmod +x "$dir/nimbus"

      # Artifacts download under runner.temp, never into the checkout: the fixed places the script's
      # LAYOUT reads.
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readwise-package
          path: ${{ runner.temp }}/nimbus-package

      - name: Download the scores
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-scores
          path: ${{ runner.temp }}/registry-scores

      # The key reaches the disk through env and the `printf` builtin — never argv, never a traced
      # shell — into a 0700 directory with umask 077, immediately before the one step that reads it.
      - name: Write the registry root key
        env:
          ROOT_KEY: ${{ secrets.NIMBUS_REGISTRY_ROOT_KEY }}
        run: |
          set -eu
          umask 077
          missing=""
          [ -n "${ROOT_KEY:-}" ] || missing="$missing secret:NIMBUS_REGISTRY_ROOT_KEY"
          if [ -n "$missing" ]; then
            echo "::error::the official-registry environment is missing:$missing"
            exit 1
          fi
          keys="$RUNNER_TEMP/nimbus-keys"
          mkdir -m 700 "$keys"
          printf '%s' "$ROOT_KEY" > "$keys/root.key"

      # Refuses a package whose SHA-256 differs from the one the package job computed.
      - name: Add to the registry
        id: publish
        env:
          PACKAGE_SHA256: ${{ needs.package.outputs.package_sha256 }}
        run: bun scripts/publish-registry.ts --publish --package-sha256 "$PACKAGE_SHA256"

      # Remove the key before anything talks to the network again.
      - name: Delete the signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/nimbus-keys"

      - name: Commit and push the registry
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          EXT_ID: ${{ steps.publish.outputs.id }}
          EXT_VERSION: ${{ steps.publish.outputs.version }}
          SEQUENCE: ${{ steps.publish.outputs.sequence }}
        working-directory: registry
        run: |
          set -euo pipefail
          # GitHub Pages must serve the folder as-is, not through Jekyll.
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "registry unchanged; nothing to push"
            exit 0
          fi
          if [ "$PUBLISHED" = "true" ]; then
            msg="registry: add ${EXT_ID}@${EXT_VERSION} (sequence ${SEQUENCE})"
          else
            msg="registry: add .nojekyll"
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$msg" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA}, run ${GITHUB_RUN_ID}."
          # The token goes to git through GIT_CONFIG_* env, not argv and not .git/config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
