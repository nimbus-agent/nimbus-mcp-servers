name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand when a trigger is missed or a re-run is wanted
  # without an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Platform equality is a Nimbus non-negotiable, and these connectors carry
        # path handling that only misbehaves on one OS. Three legs, same command.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run audit:connector-consent
      - run: bun test

  required:
    name: CI — required gates
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      # Mirrors the monorepo's aggregator: one required status check that every
      # other job feeds, so adding a gate never needs a ruleset edit.
      - run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check matrix did not pass"; exit 1
          fi
          echo "all gates green"
