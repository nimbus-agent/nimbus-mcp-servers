version: 2
updates:
  # `bun`, not `npm`. Dependabot treats Bun as its OWN ecosystem; the npm one does
  # not understand `bun.lock`, so it bumped package.json and left the lockfile
  # untouched — every PR it opened then failed CI at `bun install --frozen-lockfile`
  # with "lockfile had changes, but lockfile is frozen" (#11).
  #
  # Known limitation, recorded rather than discovered later: the bun ecosystem
  # supports VERSION updates but not SECURITY updates. Dependabot *alerts* still
  # fire — they come from advisories, not from this config — so a vulnerability
  # still surfaces in the Security tab; what you do not get is an automatically
  # opened security-fix PR. Weekly version updates carry most fixes anyway, and a
  # working PR beats a security PR that cannot merge.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Bump all actions in a single grouped PR. Multi-step actions such as
    # github/codeql-action (init + analyze) MUST move together — a split bump
    # leaves the steps on mismatched versions and CodeQL hard-fails with
    # "Loaded a configuration file for version X, but running version Y".
    groups:
      github-actions:
        patterns:
          - "*"
