# SonarQube Cloud (SonarCloud) configuration for nimbus-mcp-servers.
# Project must be imported into the `nimbus-agent` SonarCloud org and a
# SONAR_TOKEN repo/org secret set; the sonar.yml workflow skips analysis when
# the token is absent.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-mcp-servers
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Source in src/ + scripts/; tests live under test/ and alongside sources in
# src/ and scripts/ (**/*.test.ts). Every directory that can hold a test file
# must appear in sonar.tests, otherwise sonar.test.inclusions — which filters
# inside sonar.tests — cannot reclassify it and Sonar analyses a test as
# production source.
sonar.sources=connectors,shared,standalone,scripts
sonar.tests=connectors,shared,standalone,scripts
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/coverage/**

# bun test --coverage --coverage-reporter=lcov writes coverage/lcov.info.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true

# No sonar.coverage.exclusions and no sonar.cpd.exclusions.
#
# Both were added in #17 on the assumption they were what failed the first quality gate on main.
# The measurements say otherwise, and the exclusions were removed rather than left in place:
#
#   duplicated_lines_density        0.3%   (threshold 3%)   — never close
#   new_duplicated_lines_density    0.0%   (threshold 3%)
#   coverage                       96.4%   3254 lines to cover, 118 uncovered
#
# The gate failed on new_coverage (76.5% against 80%) and new_reliability_rating (4 against 1) —
# 43 uncovered lines in three scripts plus one real bug, both of which are now fixed in the code.
# Excluding the connector entry points would have masked 14,125 lines of largely untested source
# to hide a 43-line problem.
#
# If a connector-shaped exclusion is ever genuinely needed, add it with the measurement that
# justifies it, not the assumption.
