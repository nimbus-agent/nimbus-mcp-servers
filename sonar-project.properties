# SonarQube Cloud (SonarCloud) configuration for nimbus-mcp-servers.
# Project must be imported into the `nimbus-agent` SonarCloud org and a
# SONAR_TOKEN repo/org secret set; the sonar.yml workflow skips analysis when
# the token is absent.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-mcp-servers
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Source in src/ + scripts/; tests live under test/ and alongside sources in
# src/ and scripts/ (**/*.test.ts). Every directory that can hold a test file
# must appear in sonar.tests, otherwise sonar.test.inclusions — which filters
# inside sonar.tests — cannot reclassify it and Sonar analyses a test as
# production source.
sonar.sources=connectors,shared,standalone,scripts
sonar.tests=connectors,shared,standalone,scripts
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/coverage/**

# bun test --coverage --coverage-reporter=lcov writes coverage/lcov.info.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true

# ── Connector-shaped exclusions ────────────────────────────────────────────
# Carried over from the Nimbus monorepo, which excluded exactly these two
# patterns before the connectors moved here. That config's comment said the
# exclusion "is that repository's concern now" — this is that repository, and
# the patterns did not arrive with the code. The first analysis of `main`
# failed its quality gate as a result.
#
# COVERAGE. Each connector's `src/server.ts` ends in a top-level
# `await mcp.connect(transport)` against a StdioServerTransport. No in-process
# unit test reaches that line — the testable logic lives in `search-filter.ts`
# and the shared kits, which ARE covered. 94 uncovered connect-shells otherwise
# dominate the coverage metric. `src/tools.ts` is the same class: thin
# `reg(name, desc, schema, handler)` registrations whose handlers shell out or
# fetch.
#
# The per-connector sandbox suite (`test/sandbox.test.ts`, gated on
# NIMBUS_TEST_HARNESS) does reach them, and is deliberately NOT a coverage
# layer: each test opens a REAL connection to that connector's declared network
# host, so it is off by default. Run it with `bun run test:sandbox`.
sonar.coverage.exclusions=connectors/*/src/server.ts,connectors/*/src/tools.ts
#
# DUPLICATION. Connectors are authored from a shared template, so `server.ts`
# files are structurally near-identical by design — auth header, HTTP wrapper,
# the three mandatory read-tool registrations. Normalising two connectors'
# names and diffing them leaves 173 differing lines out of ~200: that is the
# intended shape, not copy-paste debt, and CPD cannot tell the difference.
sonar.cpd.exclusions=connectors/*/src/server.ts,connectors/*/src/tools.ts
